name: CI Tests

# Автоматический прогон всех 3 шагов системы автотестов Modeus Student Enhancer
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Шаг 3 требует запущенного браузера с открытым портом отладки DevTools Protocol (CDP)
      - name: Start Headless Chrome for CDP Layout Tests
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/chrome-debug --remote-allow-origins=* --remote-debugging-address=127.0.0.1 --window-size=1280,800 --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:9222/json/version && break
            sleep 0.2
          done

      # Прогон всех трёх тестовых наборов:
      # 1. 1-static-contracts.test.js (архитектура, манифест, SVG, мёртвый код/CSS)
      # 2. 2-unit-and-dom.test.js (модульная и DOM-логика, сессии, криптография, баллы, таргетинг)
      # 3. 3-live-chrome-layout.test.js (живые визуальные и геометрические тесты разметки)
      - name: Run All Test Suites
        run: node --test tools-src/*.test.js
